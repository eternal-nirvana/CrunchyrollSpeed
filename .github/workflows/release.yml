name: Build & Publish Release (APK + EXE)

on:
  release:
    types: [published, created]
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CR-Speed-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

  build-windows:
    name: Build Windows Laptop EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller

      - name: Build Windows Executable
        run: |
          pyinstaller --onefile --windowed --name "CR-Speed" desktop/cr_speed.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CR-Speed-Windows-EXE
          path: dist/CR-Speed.exe

  publish:
    name: Attach Binaries to GitHub Release
    needs: [build-android, build-windows]
    if: always() && (needs.build-android.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets

      - name: Prepare Assets
        run: |
          mkdir -p ./final-assets
          find ./release-assets -type f -name "*.apk" -exec cp {} ./final-assets/CR-Speed.apk \; || true
          find ./release-assets -type f -name "*.exe" -exec cp {} ./final-assets/CR-Speed.exe \; || true
          ls -la ./final-assets/

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || 'v1.0.0' }}
          files: |
            ./final-assets/CR-Speed.apk
            ./final-assets/CR-Speed.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
